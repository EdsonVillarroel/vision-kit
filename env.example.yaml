# ─────────────────────────────────────────────────────────────────────────────
# Cloud Run — variables de entorno del backend NestJS
#
# USO:
#   1. cp env.example.yaml env.yaml
#   2. Rellenar los valores reales (env.yaml está en .gitignore — NO se commitea)
#   3. gcloud run deploy vision-kit-backend --env-vars-file env.yaml ...
#
# Secretos JWT: generarlos con  bash scripts/generate-secrets.sh
# URLs Supabase: Project Settings → Database → Connection string
# ─────────────────────────────────────────────────────────────────────────────

NODE_ENV: production

# Runtime — Transaction pooler (puerto 6543). Obligatorio con escala a cero.
DATABASE_URL: postgresql://postgres.fobfltxxsudplapdwlfj:PASSWORD@aws-0-REGION.pooler.supabase.com:6543/postgres?pgbouncer=true

# Migraciones — Direct connection (puerto 5432).
DIRECT_URL: postgresql://postgres.fobfltxxsudplapdwlfj:PASSWORD@aws-0-REGION.pooler.supabase.com:5432/postgres

# Firma de tokens (bash scripts/generate-secrets.sh)
JWT_SECRET: REEMPLAZAR
JWT_PLATFORM_SECRET: REEMPLAZAR
JWT_EXPIRES_IN: 1d
JWT_PLATFORM_EXPIRES_IN: 1d

# CORS — los 3 dominios de Firebase Hosting, separados por coma (sin espacios)
CORS_ORIGINS: https://vision-kit.web.app,https://vision-2020-hd.web.app,https://vision-kit-admin.web.app

